name: cpe_pilot
description: CPE 管家 - 华为 HiLink 系列 5G CPE 的信号、短信与锁频管理工具
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # 必须锁死 3.0.3：3.0.8 要求 Dart >= 3.4，而 Flutter 3.19 对应 Dart 3.3
  crypto: 3.0.3
  xml: ^6.5.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
